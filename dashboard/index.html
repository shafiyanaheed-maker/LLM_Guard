<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>LLM-Guard Dashboard</title>

<!-- Verified Bootstrap CSS Link -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Updated CSS path to match the mounted FastAPI static directory -->
<link class="sub-stylesheet" rel="stylesheet" href="/dashboard/style.css">

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

<h1 class="text-center">
LLM-Guard Dashboard
</h1>

<hr>

<div class="row">

<!-- Updated grid system to col-md-2 for a 5-column dashboard configuration layout -->
<div class="col-md-2">

<div class="card bg-success">

<div class="card-body">

<h3 id="totalRequests">0</h3>

<p>Total Requests</p>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card bg-danger">

<div class="card-body">

<h3 id="blockedRequests">0</h3>

<p>Blocked Requests</p>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card bg-primary">

<div class="card-body">

<h3 id="successRequests">0</h3>

<p>Successful Requests</p>

</div>

</div>

</div>

<div class="col-md-2">

    <div class="card bg-warning">

        <div class="card-body">

            <h3 id="systemHealth">Online</h3>

            <p>System Health</p>

        </div>

    </div>

</div>

<!-- Added Attack Attempts Metrics card -->
<div class="col-md-2">

    <div class="card bg-danger">

        <div class="card-body">

            <h3 id="attackAttempts">0</h3>

            <p>Attack Attempts</p>

        </div>

    </div>

</div>

</div>

</div>

<div class="container mt-5">

    <div class="card bg-secondary">

        <div class="card-body">

            <h3 class="text-white">
                Request Statistics
            </h3>

            <canvas id="requestChart"></canvas>

        </div>

    </div>

</div>

<!-- Added Pie Chart layout wrapper beneath the bar chart -->
<div class="container mt-4">

    <div class="row">

        <div class="col-md-6">

            <div class="card bg-secondary">

                <div class="card-body">

                    <h4 class="text-white">
                        Success vs Blocked
                    </h4>

                    <canvas id="pieChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Added Recent Activity section below the pie chart -->
<div class="container mt-4">

    <div class="row">

        <div class="col-12">

            <div class="card bg-secondary">

                <div class="card-body">

                    <h4 class="text-white">
                        Recent Activity
                    </h4>

                    <table class="table table-dark table-striped">

                        <thead>

                            <tr>
                                <th>User</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Prompt</th>
                                <th>Time</th>
                            </tr>

                        </thead>

                        <tbody id="activityTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Verified script tags at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/dashboard/script.js"></script>

</body>
</html>
